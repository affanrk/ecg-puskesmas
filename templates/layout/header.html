<header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-30 shrink-0 relative">
    <div class="flex items-center gap-4">
        <h1 class="font-bold text-slate-800 text-lg tracking-tight">ECG<span class="text-brand-600">Live</span></h1>
        <div class="h-5 w-px bg-slate-200 mx-2"></div>
        <div class="flex items-center gap-2 px-3 py-1 bg-slate-50 rounded-full border border-slate-200">
            <span id="connection-badge" class="flex w-2 h-2 bg-rose-500 rounded-full"></span>
            <span id="connection-text" class="text-[10px] font-bold text-rose-700">Disconnected</span>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <div class="relative w-56" id="custom-device-dropdown">
            <button id="device-btn"
                class="w-full bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-3 py-2 flex items-center justify-between transition-all active:scale-95 duration-75 relative z-10">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div id="device-status-dot" class="w-2 h-2 rounded-full bg-slate-300"></div>
                    <span id="device-btn-text" class="truncate font-medium">Select Device...</span>
                </div>
                <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <div id="device-list-wrapper"
                class="hidden absolute top-full left-0 w-full mt-2 bg-white border border-slate-200 rounded-xl shadow-2xl ring-1 ring-black/5 z-[100] overflow-hidden transform origin-top transition-all">
                <div class="p-2 border-b border-slate-100 bg-slate-50">
                    <input type="text" id="device-search-input" placeholder="Search ID..."
                        class="w-full text-xs px-2 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                </div>
                <div id="device-list-container" class="max-h-60 overflow-y-auto custom-scrollbar bg-white">
                    <div class="p-4 text-xs text-slate-400 text-center italic">Scanning...</div>
                </div>
                <div class="p-2 border-t border-slate-100 bg-slate-50 text-center">
                    <button id="btn-disconnect-device"
                        class="text-xs text-rose-600 hover:text-white hover:bg-rose-500 font-bold w-full py-1.5 rounded transition-colors">Disconnect</button>
                </div>
            </div>
        </div>

        <div id="header-status-indicator"
            class="hidden items-center gap-2 bg-rose-50 px-3 py-1 rounded-full border border-rose-100">
            <div class="w-2 h-2 bg-rose-500 rounded-full animate-ping"></div>
            <span class="text-xs font-bold text-rose-600">RECORDING</span>
        </div>
    </div>
</header>
