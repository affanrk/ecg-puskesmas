<div id="view-performance" class="tab-content hidden space-y-4 max-w-[1600px] mx-auto">
    <div class="grid grid-cols-3 gap-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Latency</h4>
            <div class="text-2xl font-mono font-bold text-brand-600" id="stat-latency">0 ms</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Jitter</h4>
            <div class="text-2xl font-mono font-bold text-amber-600" id="stat-jitter">0 ms</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Packet Loss</h4>
            <div class="text-2xl font-mono font-bold text-rose-600" id="stat-loss">0%</div>
        </div>
    </div>

    <div class="space-y-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <h4 class="text-xs font-bold text-slate-700 mb-2">Latency History</h4>
            <div class="h-32 w-full"><canvas id="latencyChart"></canvas></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <h4 class="text-xs font-bold text-slate-700 mb-2">Jitter History</h4>
            <div class="h-32 w-full"><canvas id="jitterChart"></canvas></div>
        </div>
    </div>
</div>
