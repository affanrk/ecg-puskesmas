<div id="view-history" class="tab-content hidden space-y-4 max-w-[1600px] mx-auto">
    <div
        class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[calc(100vh-6rem)]">
        <div
            class="px-4 py-3 border-b border-slate-100 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3 bg-white sticky top-0 z-20">
            <div class="flex flex-col sm:flex-row items-center gap-2 flex-1 w-full">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none z-10">
                        <svg class="w-4 h-4 text-slate-400 group-hover:text-brand-500 transition-colors" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <input type="text" id="archive-date-range"
                        class="pl-9 pr-3 py-2 text-xs font-medium w-full sm:w-56 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 hover:border-brand-300 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none cursor-pointer transition-all placeholder:text-slate-400 text-slate-700 shadow-sm"
                        placeholder="Filter by Date">
                </div>
                <input type="text" id="archive-search"
                    class="px-3 py-2 text-xs w-full sm:w-64 rounded-lg border border-slate-200 bg-white focus:ring-1 focus:ring-brand-500 outline-none"
                    placeholder="Search Patient...">
                <button id="btn-clear-filter"
                    class="px-3 py-2 text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 rounded-lg shadow-sm transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    Clear
                </button>
            </div>
            <div class="flex items-center gap-2" id="export-actions">
                <button id="btn-download-raw" disabled
                    class="disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 bg-white border border-slate-200 text-slate-600 hover:text-brand-600 rounded-md text-[10px] font-bold transition-all shadow-sm">Raw
                    CSV</button>
                <button id="btn-download-feature" disabled
                    class="disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 bg-white border border-slate-200 text-slate-600 hover:text-brand-600 rounded-md text-[10px] font-bold transition-all shadow-sm">Features</button>
                <button id="btn-download-plot" disabled
                    class="disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 bg-white border border-slate-200 text-slate-600 hover:text-brand-600 rounded-md text-[10px] font-bold transition-all shadow-sm">Chart
                    Image</button>
            </div>
        </div>
        <div class="flex-1 overflow-auto custom-scrollbar">
            <table class="w-full text-left">
                <thead
                    class="bg-slate-50 text-sm uppercase text-slate-400 font-bold tracking-wider sticky top-0 z-10 shadow-sm">
                    <tr>
                        <th class="px-6 py-3 bg-slate-50">Time</th>
                        <th class="px-6 py-3 bg-slate-50">Device</th>
                        <th class="px-6 py-3 bg-slate-50">NIK</th>
                        <th class="px-6 py-3 bg-slate-50">Name</th>
                        <th class="px-6 py-3 bg-slate-50">Result</th>
                    </tr>
                </thead>
                <tbody id="history-table-body-download" class="divide-y divide-slate-50"></tbody>
            </table>
        </div>
        <div class="px-4 py-2 border-t border-slate-100 bg-slate-50 flex justify-between items-center">
            <span class="text-[10px] text-slate-500">Page <span id="archive-page-input" class="font-bold">1</span> of
                <span id="archive-total-pages">1</span></span>
            <div class="flex gap-1">
                <button id="btn-prev-archive" class="p-1 rounded hover:bg-slate-200 text-slate-500 disabled:opacity-50">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button id="btn-next-archive" class="p-1 rounded hover:bg-slate-200 text-slate-500 disabled:opacity-50">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
