<!DOCTYPE html>
<html lang="en" class="antialiased">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG Live Platform</title>
    <link rel="shortcut icon" href="{{ url_for('static', path='/favicon.ico') }}" />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>

<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden selection:bg-brand-100 selection:text-brand-900">

    <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col items-end pointer-events-none"></div>

    <div class="flex h-full">
        {% block sidebar %}{% endblock %}

        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            {% block header %}{% endblock %}

            <div class="flex-1 overflow-auto bg-slate-50/50 p-4 custom-scrollbar relative z-0">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    {% block modal %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script type="module" src="{{ url_for('static', path='/js/app.js') }}?v=3"></script>
</body>

</html>
