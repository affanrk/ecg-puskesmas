<div id="patientModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity"></div>
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div
                class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-slate-100">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-sm font-bold text-slate-800">New Patient Session</h3>
                    <button id="modal-cancel-x" class="text-slate-400 hover:text-rose-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="px-5 py-5 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">NIK
                                (KTP)</label>
                            <input id="modal-subject" type="text"
                                class="block w-full px-3 py-2 rounded-lg border-slate-200 bg-slate-50 text-slate-900 focus:ring-2 focus:ring-brand-500 focus:bg-white text-xs font-medium placeholder:text-slate-300 transition-all outline-none"
                                placeholder="16 Digit NIK">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Full
                                Name</label>
                            <input id="modal-name" type="text"
                                class="block w-full px-3 py-2 rounded-lg border-slate-200 bg-slate-50 text-slate-900 focus:ring-2 focus:ring-brand-500 focus:bg-white text-xs font-medium placeholder:text-slate-300 transition-all outline-none"
                                placeholder="Patient Name">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Place
                                of Birth</label>
                            <input id="modal-pob" type="text"
                                class="block w-full px-3 py-2 rounded-lg border-slate-200 bg-slate-50 text-slate-900 focus:ring-2 focus:ring-brand-500 focus:bg-white text-xs font-medium placeholder:text-slate-300 transition-all outline-none"
                                placeholder="City">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Date
                                of Birth</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none z-10">
                                    <svg class="w-4 h-4 text-slate-400 group-hover:text-brand-500 transition-colors"
                                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                </div>
                                <input id="modal-dob" type="text"
                                    class="pl-9 pr-3 py-2 text-xs font-medium w-full rounded-lg border border-slate-200 bg-white hover:bg-slate-50 hover:border-brand-300 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none cursor-pointer transition-all placeholder:text-slate-400 text-slate-700 shadow-sm"
                                    placeholder="Select Date">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 items-end">
                        <div class="col-span-1">
                            <label
                                class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Age</label>
                            <div id="age-display-container"
                                class="h-[38px] w-full rounded-lg bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center shadow-md shadow-brand-200 text-white font-bold text-lg transition-all">
                                <input id="modal-age" type="text" readonly
                                    class="bg-transparent text-center w-full text-white placeholder-white/50 cursor-default outline-none"
                                    placeholder="0">
                            </div>
                        </div>
                        <div class="col-span-2">
                            <label
                                class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Gender</label>
                            <select id="modal-gender"
                                class="modern-select block w-full px-3 py-2 rounded-lg border-slate-200 bg-white text-slate-700 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-xs font-semibold outline-none cursor-pointer shadow-sm transition-all hover:border-brand-300">
                                <option value="L">Male (Laki-laki)</option>
                                <option value="P">Female (Perempuan)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1">Medical
                            History</label>
                        <select id="modal-riwayat"
                            class="modern-select block w-full px-3 py-2 rounded-lg border-slate-200 bg-white text-slate-700 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-xs font-semibold outline-none cursor-pointer shadow-sm transition-all hover:border-brand-300">
                            <option value="Normal">Normal</option>
                            <option value="Hipertensi">Hipertensi</option>
                            <option value="Jantung">Riwayat Jantung</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex flex-row justify-end gap-2">
                    <button id="modal-cancel" type="button"
                        class="px-3 py-2 text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all">Cancel</button>
                    <button id="modal-submit" type="button"
                        class="px-4 py-2 text-xs font-bold text-white bg-brand-600 rounded-lg shadow-sm shadow-brand-200 hover:bg-brand-500 transition-all active:scale-95">Start
                        Session</button>
                </div>
            </div>
        </div>
    </div>
</div>
