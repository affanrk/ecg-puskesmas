<div id="view-monitor" class="tab-content space-y-4 max-w-[1600px] mx-auto pb-20">
    <div class="grid grid-cols-12 gap-4 h-32 lg:h-28">
        <div
            class="col-span-12 lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col justify-center relative overflow-hidden">
            <div id="section-initial" class="flex items-center justify-between w-full gap-4">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center border border-slate-100 text-2xl">
                        📇</div>
                    <div>
                        <h4 class="text-base font-bold text-slate-800">No Active Session</h4>
                        <p class="text-xs text-slate-500">Input data to start analysis.</p>
                    </div>
                </div>
                <button id="btn-input-data"
                    class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold py-2.5 px-5 rounded-lg shadow-sm shadow-brand-200 transition-all active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    New Session
                </button>
            </div>
            <div id="section-patient" class="hidden w-full h-full">
                <input type="hidden" id="hidden-subject-id">
                <div class="flex justify-between items-center h-full">
                    <div class="flex-1 space-y-1.5 pr-4">
                        <div class="flex items-center gap-2">
                            <span id="disp-name"
                                class="text-lg font-bold text-slate-800 truncate max-w-[220px] leading-tight">Patient
                                Name</span>
                            <span id="disp-gender"
                                class="text-[10px] px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md border border-slate-200 font-bold uppercase tracking-wide">M</span>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-slate-500 font-mono">
                            <span class="flex items-center gap-1.5"><span class="text-slate-400">ID:</span> <span
                                    id="disp-subject" class="font-semibold text-slate-600">12345678</span></span>
                            <span class="w-px h-3 bg-slate-300"></span>
                            <span class="flex items-center gap-1.5"><span class="text-slate-400">Age:</span> <span
                                    id="disp-age" class="font-semibold text-slate-600">25 Th</span></span>
                        </div>
                        <div class="flex items-center gap-1.5 text-xs">
                            <span class="text-slate-400">History:</span>
                            <span id="disp-riwayat" class="font-bold text-slate-700">Normal</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 justify-center h-full pl-4 border-l border-slate-100">
                        <button id="btn-record-toggle"
                            class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-sm transition-all active:scale-95 w-28 flex justify-center items-center">Start
                            Rec</button>
                        <button id="btn-reset-session"
                            class="text-[10px] font-bold text-slate-400 hover:text-rose-500 py-1 transition-colors">End
                            Session</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-span-12 lg:col-span-4 grid grid-cols-2 gap-4">
            <div
                class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col justify-between relative overflow-hidden">
                <div class="flex justify-between items-start z-10">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Heart Rate</h3>
                    <div class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></div>
                </div>
                <div class="flex items-baseline gap-1 mt-1 z-10">
                    <span class="text-4xl font-mono font-bold text-slate-800" id="bpm-value">--</span>
                    <span class="text-xs font-medium text-slate-400">BPM</span>
                </div>
                <svg class="absolute -bottom-2 -right-2 w-16 h-16 text-rose-50 opacity-50 z-0" fill="currentColor"
                    viewBox="0 0 24 24">
                    <path
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col justify-between">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Duration</h3>
                <div class="flex items-center flex-1">
                    <span class="text-3xl font-mono font-bold text-slate-700" id="recording-timer">00:00</span>
                </div>
            </div>
        </div>
        <div class="col-span-12 lg:col-span-3">
            <div id="ai-card-container"
                class="h-full bg-gradient-to-br from-brand-500 to-brand-600 rounded-xl shadow-lg shadow-brand-500/20 p-4 text-white flex flex-col justify-between relative overflow-hidden transition-colors duration-500">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-[10px] font-bold text-brand-100 uppercase tracking-wider">AI Insight</h3>
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse shadow-[0_0_5px_white]"></span>
                    </div>
                    <div class="text-xl font-bold leading-tight tracking-tight truncate" id="ai-prediction-text">
                        Waiting...</div>
                </div>
                <div class="relative z-10 mt-2">
                    <div class="flex justify-between items-end mb-1">
                        <p class="text-brand-50 text-[10px] font-medium opacity-90" id="ai-prediction-sub">Conf: 0%</p>
                    </div>
                    <div class="w-full bg-black/20 rounded-full h-1.5 overflow-hidden backdrop-blur-sm">
                        <div id="ai-confidence-bar"
                            class="bg-white h-full rounded-full transition-all duration-500 ease-out" style="width: 0%">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-1">
        <div class="flex items-center justify-between px-4 py-2 border-b border-slate-50 bg-slate-50/30">
            <h3 class="font-bold text-slate-700 text-xs flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-brand-500"></div>
                Live ECG Signal
            </h3>
            <div class="flex gap-2">
                <label
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg cursor-pointer select-none group bg-white border border-slate-200 hover:border-blue-300 hover:bg-blue-50/50 transition-all duration-200 active:scale-95 hover:shadow-sm">
                    <input type="checkbox" checked value="0" class="peer sr-only lead-toggle">
                    <div
                        class="w-2.5 h-2.5 rounded-full bg-blue-200 peer-checked:bg-blue-500 peer-checked:shadow-[0_0_6px_rgba(59,130,246,0.5)] transition-all duration-200">
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 peer-checked:text-blue-600 transition-colors">Lead
                        I</span>
                </label>

                <label
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg cursor-pointer select-none group bg-white border border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/50 transition-all duration-200 active:scale-95 hover:shadow-sm">
                    <input type="checkbox" checked value="1" class="peer sr-only lead-toggle">
                    <div
                        class="w-2.5 h-2.5 rounded-full bg-emerald-200 peer-checked:bg-emerald-500 peer-checked:shadow-[0_0_6px_rgba(16,185,129,0.5)] transition-all duration-200">
                    </div>
                    <span
                        class="text-[10px] font-bold text-slate-400 peer-checked:text-emerald-600 transition-colors">Lead
                        II</span>
                </label>

                <label
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg cursor-pointer select-none group bg-white border border-slate-200 hover:border-amber-300 hover:bg-amber-50/50 transition-all duration-200 active:scale-95 hover:shadow-sm">
                    <input type="checkbox" checked value="2" class="peer sr-only lead-toggle">
                    <div
                        class="w-2.5 h-2.5 rounded-full bg-amber-200 peer-checked:bg-amber-500 peer-checked:shadow-[0_0_6px_rgba(245,158,11,0.5)] transition-all duration-200">
                    </div>
                    <span
                        class="text-[10px] font-bold text-slate-400 peer-checked:text-amber-600 transition-colors">V1</span>
                </label>
            </div>
        </div>
        <div class="h-[280px] w-full relative bg-white">
            <div class="absolute inset-0 z-0 opacity-[0.03]"
                style="background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px); background-size: 20px 20px;">
            </div>
            <canvas id="ecgChart" class="relative z-10"></canvas>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
        <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h3 class="font-bold text-slate-700 text-xs">Analysis Log</h3>
            <span class="text-[10px] text-slate-400 font-mono" id="live-total-count">0 Recs</span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-xs uppercase text-slate-400 font-bold tracking-wider">
                    <tr>
                        <th class="px-4 py-2">Time</th>
                        <th class="px-4 py-2">ID</th>
                        <th class="px-4 py-2">Name</th>
                        <th class="px-4 py-2">Result</th>
                    </tr>
                </thead>
                <tbody id="live-table-body" class="divide-y divide-slate-50"></tbody>
            </table>
        </div>
        <div class="px-4 py-2 border-t border-slate-100 bg-slate-50 flex justify-between items-center">
            <span class="text-[10px] text-slate-500">Page <span id="live-page-current"
                    class="font-bold text-slate-700">1</span> / <span id="live-page-total">1</span></span>
            <div class="flex gap-1">
                <button id="btn-prev-live"
                    class="p-1 rounded hover:bg-slate-200 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button id="btn-next-live"
                    class="p-1 rounded hover:bg-slate-200 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
