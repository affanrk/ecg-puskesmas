{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center h-full text-center p-8">
    <div class="bg-white rounded-2xl shadow-xl p-12 max-w-lg w-full border border-slate-100">
        <div class="w-20 h-20 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />

        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Admin Dashboard</h1>
        <p class="text-slate-500 mb-8">System Control Panel</p>
        
        <div class="bg-slate-50 rounded-xl p-6 border border-slate-200 mb-8">
            <p class="text-slate-600 font-medium">Coming Soon</p>
            <p class="text-sm text-slate-400 mt-1">User management and system configuration.</p>
        </div>

        <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-6 rounded-xl transition-colors btn-logout">
            Sign Out
        </button>
    </div>
</div>
{% endblock %}
