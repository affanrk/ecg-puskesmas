{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center h-full text-center p-8">
    <div class="bg-white rounded-2xl shadow-xl p-12 max-w-lg w-full border border-slate-100">
        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Doctor Dashboard</h1>
        <p class="text-slate-500 mb-8">Welcome, Dr. <span class="font-semibold text-emerald-600 user-name-display">Doctor</span>!</p>
        
        <div class="bg-slate-50 rounded-xl p-6 border border-slate-200 mb-8">
            <p class="text-slate-600 font-medium">Coming Soon</p>
            <p class="text-sm text-slate-400 mt-1">Medical analysis tools are under development.</p>
        </div>

        <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-6 rounded-xl transition-colors btn-logout">
            Sign Out
        </button>
    </div>
</div>
{% endblock %}
