{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center h-full text-center p-8">
    <div class="bg-white rounded-2xl shadow-xl p-12 max-w-lg w-full border border-slate-100">
        <div class="w-20 h-20 bg-brand-50 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Patient Dashboard</h1>
        <p class="text-slate-500 mb-8">Welcome, <span class="font-semibold text-brand-600 user-name-display">User</span>!</p>
        
        <div class="bg-slate-50 rounded-xl p-6 border border-slate-200 mb-8">
            <p class="text-slate-600 font-medium">Coming Soon</p>
            <p class="text-sm text-slate-400 mt-1">This panel is currently under development.</p>
        </div>

        <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-6 rounded-xl transition-colors btn-logout">
            Sign Out
        </button>
    </div>
</div>
{% endblock %}
