<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ECG Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 500: '#0ea5e9', 600: '#0284c7' } } } } }
    </script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen">

    <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col items-end pointer-events-none"></div>

    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl shadow-slate-200 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
            <p class="text-slate-500 text-sm mt-2">Sign in to access ECG Dashboard</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all text-sm">
            </div>
            
            <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-brand-500/30 text-sm mt-2">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Don't have an account? <a href="/register" class="text-brand-600 font-bold hover:underline">Register</a>
        </div>
    </div>

    <script type="module">
        import { AuthController } from "{{ url_for('static', path='/js/modules/auth/AuthController.js') }}";
        new AuthController();
    </script>
</body>
</html>
