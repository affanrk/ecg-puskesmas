services:
  postgres:
    image: postgres:15-alpine
    container_name: ecg_postgres
    restart: always 
    environment:
      POSTGRES_USER: ${DATABASE_USER:-ecg_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecg_pass}
      POSTGRES_DB: ${DATABASE_NAME:-ecg_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ecg_user} -d ${DATABASE_NAME:-ecg_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ecg_mqtt_broker
    restart: always
    ports:
      - "1883:1883" 
    volumes:
      - ./mosquitto/config/:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecg_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-ecg_user} 
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ecg_pass}
      DATABASE_NAME: ${DATABASE_NAME:-ecg_db}
      MQTT_BROKER: mosquitto 
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-admin}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-ecgctai}
      MODEL_PATH: "/app/ml_models"
      FLASK_PORT: 8080
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-it}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    container_name: ecg_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: