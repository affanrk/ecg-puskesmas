services:
  postgres:
    image: postgres:15-alpine
    container_name: ecg_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-ecg_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecg_pass}
      POSTGRES_DB: ${DATABASE_NAME:-ecg_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ecg_user} -d ${DATABASE_NAME:-ecg_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: ecg_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@ecg.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data: